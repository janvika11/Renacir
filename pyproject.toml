[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renacir"
version = "0.1.0"
description = "Confidence-aware, validation-gated repair system for reproducible CI/CD failures (research project)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.scripts]
renacir-benchmark = "renacir.benchmark.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/renacir"]

[tool.ruff]
line-length = 100
target-version = "py311"
# benchmarks/ contains intentionally-broken fixture code (unused imports,
# stale references, etc. are the bugs under test) and must not be held to
# Renacir's own lint standards -- see docs/decisions.md's Phase 2B entry.
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=benchmarks"
